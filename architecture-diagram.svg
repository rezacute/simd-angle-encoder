<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720">
  <defs>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9"/>
      <stop offset="100%" style="stop-color:#c8e6c9"/>
    </linearGradient>
    <linearGradient id="frameworkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd"/>
      <stop offset="100%" style="stop-color:#bbdefb"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0"/>
      <stop offset="100%" style="stop-color:#ffe0b2"/>
    </linearGradient>
    <linearGradient id="pyo3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec"/>
      <stop offset="100%" style="stop-color:#f8bbd9"/>
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffebee"/>
      <stop offset="100%" style="stop-color:#ffcdd2"/>
    </linearGradient>
    <linearGradient id="simdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5"/>
      <stop offset="100%" style="stop-color:#e1bee7"/>
    </linearGradient>
    <linearGradient id="hwGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eceff1"/>
      <stop offset="100%" style="stop-color:#cfd8dc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#333">SIMD Angle Encoder Architecture</text>
  <text x="450" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666">High-Performance Quantum ML Data Encoding (40-90x speedup)</text>

  <!-- User Layer -->
  <rect x="50" y="75" width="800" height="55" rx="8" fill="url(#userGrad)" stroke="#4caf50" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">User Layer</text>
  <text x="70" y="118" font-family="Arial, sans-serif" font-size="11" fill="#555">Python Applications: QML Workloads, Neural Networks, Data Preprocessing</text>
  <rect x="620" y="85" width="210" height="35" rx="4" fill="#fff" stroke="#81c784" stroke-width="1"/>
  <text x="725" y="107" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">encode(), encode_batch()</text>

  <!-- Arrow -->
  <path d="M450 130 L450 145" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#666"/></marker></defs>

  <!-- Framework Layer -->
  <rect x="50" y="150" width="800" height="70" rx="8" fill="url(#frameworkGrad)" stroke="#2196f3" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1565c0">Framework Integration Layer</text>
  <rect x="70" y="185" width="170" height="28" rx="4" fill="#fff" stroke="#64b5f6" stroke-width="1"/>
  <text x="155" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">pennylane_simd_angle</text>
  <rect x="260" y="185" width="150" height="28" rx="4" fill="#fff" stroke="#64b5f6" stroke-width="1"/>
  <text x="335" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">qiskit_simd_angle</text>
  <rect x="430" y="185" width="120" height="28" rx="4" fill="#fff" stroke="#64b5f6" stroke-width="1" stroke-dasharray="4"/>
  <text x="490" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Cirq (Future)</text>
  <rect x="680" y="170" width="150" height="40" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="755" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1565c0">Native Operations</text>
  <text x="755" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#555">Gradient Support</text>

  <!-- Arrow -->
  <path d="M450 220 L450 235" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Python API Layer -->
  <rect x="50" y="240" width="800" height="70" rx="8" fill="url(#apiGrad)" stroke="#ff9800" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e65100">Python API Layer</text>
  <text x="70" y="283" font-family="Arial, sans-serif" font-size="11" fill="#555">simd_angle_encoder/__init__.py</text>
  <rect x="350" y="252" width="130" height="24" rx="4" fill="#fff" stroke="#ffb74d" stroke-width="1"/>
  <text x="415" y="268" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">encode()</text>
  <rect x="490" y="252" width="130" height="24" rx="4" fill="#fff" stroke="#ffb74d" stroke-width="1"/>
  <text x="555" y="268" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">encode_batch()</text>
  <rect x="630" y="252" width="100" height="24" rx="4" fill="#fff" stroke="#ffb74d" stroke-width="1"/>
  <text x="680" y="268" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">simd_info()</text>
  <rect x="740" y="252" width="100" height="24" rx="4" fill="#fff" stroke="#ffb74d" stroke-width="1"/>
  <text x="790" y="268" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">benchmark()</text>
  <text x="70" y="300" font-family="Arial, sans-serif" font-size="10" fill="#777">Input validation • Type conversion • NumPy integration • Error handling</text>

  <!-- Arrow with label -->
  <path d="M450 310 L450 335" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="460" y="315" width="80" height="16" rx="3" fill="#fff" stroke="#999" stroke-width="1"/>
  <text x="500" y="327" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Zero-Copy</text>

  <!-- PyO3 Boundary -->
  <rect x="50" y="340" width="800" height="50" rx="8" fill="url(#pyo3Grad)" stroke="#e91e63" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c2185b">PyO3 Boundary Layer</text>
  <text x="70" y="380" font-family="Arial, sans-serif" font-size="10" fill="#555">Efficient Python-Rust FFI • PyReadonlyArray (zero-copy) • into_pyarray() (move semantics)</text>
  <rect x="620" y="350" width="210" height="32" rx="4" fill="#fff" stroke="#f06292" stroke-width="1"/>
  <text x="725" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Overhead: &lt;5% vs pure Rust</text>
  <text x="725" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#777">NumPy ↔ Rust Vec</text>

  <!-- Arrow -->
  <path d="M450 390 L450 405" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Rust Core Layer -->
  <rect x="50" y="410" width="800" height="130" rx="8" fill="url(#rustGrad)" stroke="#f44336" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c62828">Rust Core Layer</text>
  <text x="70" y="450" font-family="Arial, sans-serif" font-size="10" fill="#555">src/lib.rs • Zero-cost abstractions • Memory safety • LLVM optimizations</text>

  <!-- Encoding Methods -->
  <rect x="70" y="460" width="140" height="35" rx="4" fill="#fff" stroke="#ef5350" stroke-width="1"/>
  <text x="140" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Angle Encoding</text>
  <text x="140" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">x → x × 2π</text>
  <rect x="220" y="460" width="140" height="35" rx="4" fill="#fff" stroke="#ef5350" stroke-width="1" stroke-dasharray="4"/>
  <text x="290" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Amplitude (P2)</text>
  <text x="290" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#aaa">Normalization</text>
  <rect x="370" y="460" width="140" height="35" rx="4" fill="#fff" stroke="#ef5350" stroke-width="1" stroke-dasharray="4"/>
  <text x="440" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#888">Basis (P2)</text>
  <text x="440" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#aaa">Binary mapping</text>

  <!-- Processing Functions -->
  <rect x="540" y="460" width="290" height="70" rx="4" fill="#ffebee" stroke="#e57373" stroke-width="1"/>
  <text x="685" y="478" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c62828">Core Functions</text>
  <text x="560" y="495" font-family="monospace" font-size="9" fill="#333">simd_angle_encode()</text>
  <text x="560" y="508" font-family="monospace" font-size="9" fill="#333">simd_angle_encode_into_buffer()</text>
  <text x="560" y="521" font-family="monospace" font-size="9" fill="#333">angle_encode_batch_sequential()</text>

  <!-- Arrow -->
  <path d="M450 540 L450 555" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- SIMD Engine -->
  <rect x="50" y="560" width="800" height="70" rx="8" fill="url(#simdGrad)" stroke="#9c27b0" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="585" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#7b1fa2">SIMD Vectorization Engine</text>
  <text x="70" y="600" font-family="Arial, sans-serif" font-size="10" fill="#555">Multi-tier optimization: AVX-512 → AVX2 → NEON → Scalar fallback</text>

  <!-- SIMD Tiers -->
  <rect x="70" y="608" width="130" height="18" rx="3" fill="#fff" stroke="#ba68c8" stroke-width="1"/>
  <text x="135" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">AVX-512 (8×f64)</text>
  <rect x="210" y="608" width="120" height="18" rx="3" fill="#fff" stroke="#ba68c8" stroke-width="1"/>
  <text x="270" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">AVX2 (4×f64)</text>
  <rect x="340" y="608" width="120" height="18" rx="3" fill="#fff" stroke="#ba68c8" stroke-width="1"/>
  <text x="400" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">NEON (2×f64)</text>
  <rect x="470" y="608" width="100" height="18" rx="3" fill="#fff" stroke="#ba68c8" stroke-width="1"/>
  <text x="520" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Scalar</text>

  <!-- Performance badge -->
  <rect x="680" y="575" width="150" height="45" rx="4" fill="#fff" stroke="#8e24aa" stroke-width="1"/>
  <text x="755" y="593" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#7b1fa2">Performance</text>
  <text x="755" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">40-90x vs NumPy</text>
  <text x="755" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">1.34M ops/ms peak</text>

  <!-- Arrow -->
  <path d="M450 630 L450 645" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Hardware Layer -->
  <rect x="50" y="650" width="800" height="50" rx="8" fill="url(#hwGrad)" stroke="#607d8b" stroke-width="2" filter="url(#shadow)"/>
  <text x="70" y="675" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#37474f">CPU Hardware Layer</text>
  <rect x="300" y="660" width="150" height="30" rx="4" fill="#fff" stroke="#90a4ae" stroke-width="1"/>
  <text x="375" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">x86-64 (AVX2/512)</text>
  <rect x="470" y="660" width="150" height="30" rx="4" fill="#fff" stroke="#90a4ae" stroke-width="1"/>
  <text x="545" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">ARM64 (NEON)</text>
  <rect x="640" y="660" width="100" height="30" rx="4" fill="#fff" stroke="#90a4ae" stroke-width="1"/>
  <text x="690" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Generic</text>

  <!-- Legend -->
  <rect x="60" y="708" width="10" height="10" fill="#c8e6c9" stroke="#4caf50"/>
  <text x="75" y="717" font-family="Arial, sans-serif" font-size="9" fill="#555">Python</text>
  <rect x="130" y="708" width="10" height="10" fill="#ffcdd2" stroke="#f44336"/>
  <text x="145" y="717" font-family="Arial, sans-serif" font-size="9" fill="#555">Rust</text>
  <rect x="190" y="708" width="10" height="10" fill="#e1bee7" stroke="#9c27b0"/>
  <text x="205" y="717" font-family="Arial, sans-serif" font-size="9" fill="#555">SIMD</text>
  <rect x="250" y="708" width="20" height="10" fill="none" stroke="#666" stroke-dasharray="4"/>
  <text x="275" y="717" font-family="Arial, sans-serif" font-size="9" fill="#555">Planned</text>
</svg>
