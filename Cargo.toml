[package]
name = "simd_angle_encoder"
version = "0.1.0"
edition = "2021"
authors = ["Hybriqu Team"]
description = "SIMD-optimized angle encoding for quantum computing"

[lib]
name = "simd_angle_encoder"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.24.0"
pyo3 = { version = "0.18.0", features = ["extension-module", "abi3-py38"] }
ndarray = "0.16.1"
num-complex = "0.4.3"
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort" 