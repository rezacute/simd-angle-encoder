[package]
name = "simd_angle_encoder"
version = "0.1.0"
edition = "2021"
authors = ["Hybriqu Team"]
description = "SIMD-optimized angle encoding for quantum computing"

[lib]
name = "simd_angle_encoder"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.24.0"
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"] }
ndarray = { version = "0.16.1", features = ["rayon"] }
num-complex = "0.4.3"
num_cpus = "1.16"
rayon = "1.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "angle_encode_bench"
harness = false
path = "benchmarks/rust/angle_encode_bench.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true 