  # Security Scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Rust security audit
      uses: actions-rust-lang/audit@v1
      continue-on-error: true

    - name: Check for outdated dependencies
      uses: actions-rust-lang/cargo@v1
      with:
        command: outdated
        args: --exit-code 1
      continue-on-error: true

  # Build Status Summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [rust-quality, python-tests]
    if: always()

    steps:
    - name: Generate build summary
      run: |
        echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Job Status" >> $GITHUB_STEP_SUMMARY
        echo "- Rust Quality: ${{ needs.rust-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Python Tests: ${{ needs.python-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All artifacts and reports are available in the workflow run." >> $GITHUB_STEP_SUMMARY
