name: Performance Benchmarks

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  python-benchmarks:
    name: Python Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for benchmark comparison

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Rust builds
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin[patchelf] pytest pytest-benchmark numpy

    - name: Build Rust extension (release mode)
      run: |
        maturin develop --release

    - name: Run benchmarks - Single Encoding
      run: |
        pytest benchmarks/python/test_bench_encode.py \
          --benchmark-only \
          --benchmark-json=benchmarks/reports/encode-results.json \
          --benchmark-autosave \
          --benchmark-min-rounds=50 \
          -v

    - name: Run benchmarks - Batch Encoding
      run: |
        pytest benchmarks/python/test_bench_encode_batch.py \
          --benchmark-only \
          --benchmark-json=benchmarks/reports/batch-results.json \
          --benchmark-autosave \
          --benchmark-min-rounds=30 \
          -v

    - name: Run benchmarks - Comparative
      run: |
        pytest benchmarks/python/test_bench_comparative.py \
          --benchmark-only \
          --benchmark-json=benchmarks/reports/comparative-results.json \
          --benchmark-autosave \
          --benchmark-min-rounds=50 \
          -v

    - name: Run benchmarks - Scalability
      run: |
        pytest benchmarks/python/test_bench_scalability.py \
          --benchmark-only \
          --benchmark-json=benchmarks/reports/scalability-results.json \
          --benchmark-autosave \
          --benchmark-min-rounds=30 \
          -v

    - name: Generate benchmark summary
      if: always()
      run: |
        echo "## Benchmark Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -f benchmarks/reports/encode-results.json ]; then
          echo "### Single Encoding Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmarks/reports/encode-results.json | jq -r '.benchmarks | .[] | "\(.name): \(.stats_mean * 1000 | tonumber | .) ms"' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

        if [ -f benchmarks/reports/batch-results.json ]; then
          echo "### Batch Encoding Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmarks/reports/batch-results.json | jq -r '.benchmarks | .[] | "\(.name): \(.stats_mean * 1000 | tonumber | .) ms"' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Store benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results-${{ matrix.os }}-py${{ matrix.python-version }}
        path: benchmarks/reports/*.json
        retention-days: 30

  rust-benchmarks:
    name: Rust Criterion Benchmarks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust builds
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Run criterion benchmarks
      run: |
        cargo bench --bench angle_encode_bench -- --save-baseline main

    - name: Store criterion results
      uses: actions/upload-artifact@v3
      with:
        name: criterion-benchmark-results-${{ matrix.os }}
        path: |
          target/criterion/
        retention-days: 30

    - name: Generate criterion summary
      if: always()
      run: |
        echo "## Rust Benchmark Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Criterion benchmark reports generated in target/criterion/" >> $GITHUB_STEP_SUMMARY
