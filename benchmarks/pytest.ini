# pytest configuration for benchmark suite

[pytest]
# Test discovery patterns
python_files = test_bench_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short

# Markers for different benchmark categories
markers =
    micro: Micro-benchmarks for individual functions
    macro: Macro-benchmarks for real-world workloads
    comparative: Comparative benchmarks vs baseline
    scalability: Scalability benchmarks across sizes
    regression: Benchmarks for regression detection
